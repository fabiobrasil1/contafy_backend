version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: contafy-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-contafy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contafy123}
      POSTGRES_DB: ${DB_DATABASE:-contafy}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
